<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a12" />
    <!-- Installable full-screen app on phones (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ORION" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>ORION</title>
    <meta
      name="description"
      content="ORION: a daily survival patrol. Dodge the drone swarm, grab powers, chase the daily leaderboard. Three attempts a day, same run for every pilot. Free, no install, plays great on your phone."
    />
    <link rel="canonical" href="https://surviveorion.com/" />
    <!-- Social link previews (Reddit / Discord / Twitter / iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ORION" />
    <meta property="og:title" content="ORION: a daily survival patrol" />
    <meta
      property="og:description"
      content="Dodge the drone swarm, grab powers, chase the daily leaderboard. Three attempts a day, same run for every pilot. Free, in your browser."
    />
    <meta property="og:url" content="https://surviveorion.com/" />
    <meta property="og:image" content="https://surviveorion.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ORION: a daily survival patrol" />
    <meta
      name="twitter:description"
      content="Dodge the drone swarm, grab powers, chase the daily leaderboard. Three attempts a day, same run for every pilot."
    />
    <meta name="twitter:image" content="https://surviveorion.com/og.png" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='37' fill='none' stroke='%23ffd700' stroke-width='11'/><circle cx='50' cy='50' r='15' fill='%23c41e3a'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script>
      /* Early phone gate: keep in sync with src/webGate.ts. Native play and
         capacitor/ionic origins never land here. ?web=1 persists for the tab. */
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (q.get("web") === "1") sessionStorage.setItem("orion_web_override", "1");
          if (q.get("nativePlay") === "daily" || q.get("nativePlay") === "training") return;
          if (location.protocol === "capacitor:" || location.protocol === "ionic:") return;
          if (sessionStorage.getItem("orion_web_override") === "1") return;
          var ua = navigator.userAgent || "";
          var phone = /iPhone/i.test(ua) || (/Android/i.test(ua) && /Mobile/i.test(ua));
          if (!phone) {
            var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
            phone = !!(coarse && window.innerWidth < 700 && !/iPad/i.test(ua));
          }
          if (!phone) return;
          document.documentElement.classList.add("orion-phone-landing");
          var ui = document.getElementById("ui");
          if (!ui) return;
          ui.innerHTML =
            '<div class="screen phone-landing">' +
            '<h1 class="landing-headline">ORION is on iPhone.</h1>' +
            '<p class="landing-subline">One patrol a day. Same swarm for every pilot.</p>' +
            '<a class="landing-cta chamfer" href="https://apps.apple.com/app/id6811113450" target="_blank" rel="noopener">Get on iPhone</a>' +
            "</div>";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
