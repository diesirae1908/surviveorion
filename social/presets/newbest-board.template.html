<!-- NEW BEST score board, 1080x1920. Tokens: {{SCORE}} {{PREV_BEST}} {{DAY}} {{MUTATOR}}
     Render: substitute tokens, screenshot at 1080x1920 deviceScaleFactor 1, waitUntil 'load'
     plus document.fonts.ready. Reference golden: newbest-board-day43.png (approved in
     newbest-day43-v4-funk). Composite per README recipe: board fades in under the funk. -->
<meta charset="utf-8">
<style>
@font-face { font-family: 'Rajdhani'; src: url('fonts/Rajdhani-Bold.ttf'); font-weight: 700; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: #0a0a12; overflow: hidden; }
body { font-family: 'Rajdhani', sans-serif; position: relative; }
.star { position: absolute; border-radius: 50%; background: #fff7e0; }
.card {
  position: absolute; left: 90px; right: 90px; top: 615px; height: 695px;
  border: 2px solid #ffd700; border-radius: 24px;
  background: rgba(10,10,18,0.55);
  box-shadow: 0 0 60px rgba(255,215,0,0.18), inset 0 0 80px rgba(255,215,0,0.04);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 34px; text-align: center;
}
.mark { width: 96px; height: 96px; }
.label { color: #ffd700; font-size: 52px; font-weight: 700; letter-spacing: 0.45em; text-indent: 0.45em; }
.score {
  font-size: 150px; font-weight: 700; line-height: 1; letter-spacing: 0.02em;
  background: linear-gradient(180deg, #ffee88 0%, #ffd700 55%, #cc8800 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.prev { color: #8a7a55; font-size: 40px; font-weight: 700; }
.prev s { text-decoration-thickness: 3px; }
.day { color: #e13550; font-size: 44px; font-weight: 700; letter-spacing: 0.28em; text-indent: 0.28em; }
</style>
<div id="stars"></div>
<div class="card">
  <svg class="mark" viewBox="0 0 100 100">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffee88"/><stop offset="1" stop-color="#cc8800"/>
    </linearGradient></defs>
    <g stroke="url(#g)" stroke-width="11" fill="none" stroke-linecap="round">
      <path d="M 50 9 A 41 41 0 0 1 85.5 29.5"/>
      <path d="M 91 50 A 41 41 0 0 1 70.5 85.5"/>
      <path d="M 50 91 A 41 41 0 0 1 14.5 70.5"/>
      <path d="M 9 50 A 41 41 0 0 1 29.5 14.5"/>
    </g>
    <circle cx="50" cy="50" r="15" fill="#c41e3a"/>
  </svg>
  <div class="label">NEW BEST</div>
  <div class="score">{{SCORE}}</div>
  <div class="prev">previous best <s>{{PREV_BEST}}</s></div>
  <div class="day">DAY {{DAY}} &middot; {{MUTATOR}}</div>
</div>
<script>
// deterministic star field (mulberry32, fixed seed) so renders are byte-stable
let s = 43;
const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const box = document.getElementById('stars');
for (let i = 0; i < 90; i++) {
  const d = document.createElement('div'); d.className = 'star';
  const sz = rnd() < 0.85 ? 2 : 3;
  d.style.cssText = `left:${(rnd()*1080)|0}px;top:${(rnd()*1920)|0}px;width:${sz}px;height:${sz}px;opacity:${(0.25+rnd()*0.6).toFixed(2)}`;
  box.appendChild(d);
}
</script>
